<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Space</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hero-container">
        
        <div class="brand-block">
            <div class="logo-wrapper">
                <img src="assets/Recurso 1.svg" alt="Vital Space" class="main-logo">
            </div>

            <div class="auth-buttons-center">
                <a href="login.html" class="btn-auth btn-login">INICIAR SESIÓN</a>
                <a href="registro.html" class="btn-auth btn-register">REGISTRARSE</a>
            </div>
        </div>

        <section class="categories-flex">
            
            <a href="clinicas.html" class="category-card">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=500" alt="Clínicas">
                </div>
                <span>CLÍNICAS</span>
            </a>

            <a href="laboratorios.html" class="category-card">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1579154204601-01588f351e67?w=500" alt="Laboratorio">
                </div>
                <span>LABORATORIO</span>
            </a>

            <a href="especialidades.html" class="category-card">
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=500" alt="Especialidad">
                </div>
                <span>ESPECIALIDAD</span>
            </a>

            <a href="seguros.html" class="category-card">
                <div class="img-wrapper">
                    <img src="assets/seguro.jpeg" alt="Seguros">
                </div>
                <span>SEGUROS</span>
            </a>

        </section>

        <footer class="main-footer">
            <div class="footer-container">
                <div class="footer-location">
                    <span class="location-label">📍 UBICACIÓN:</span>
                    <select id="city-selector" class="city-select">
                        <option value="caracas">Caracas</option>
                        <option value="valencia">Valencia</option>
                        <option value="maracaibo">Maracaibo</option>
                        <option value="barquisimeto">Barquisimeto</option>
                    </select>
                </div>

                <div class="footer-links">
                    <a href="#">Términos y Condiciones</a>
                    <a href="#">Privacidad</a>
                    <a href="#">Soporte WhatsApp</a>
                </div>

                <div class="footer-copy">
                    <p>&copy; 2026 Vital Space. Todos los derechos reservados.</p>
                </div>
            </div>
        </footer>

    </main>

</body>
</html>
