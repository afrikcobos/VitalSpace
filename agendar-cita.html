<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Space — Agendar Cita Médica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header header-profile">
        <a href="index.html" class="logo-link">
            <img src="assets/Recurso 1.svg" alt="Vital Space" class="mini-logo">
        </a>
        <div class="user-menu">
            <a href="perfilUsuario.html" class="btn-logout">MI PERFIL</a>
        </div>
    </header>

    <main class="section-container">

        <div class="back-bar">
            <a href="doctores.html" class="btn-logout">← VOLVER A DOCTORES</a>
        </div>

        <section class="booking-card">
            
            <div class="booking-doctor-summary">
                <div class="doctor-avatar">
                    <svg class="icon-card" viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm9 11v-1a7 7 0 0 0-14 0v1h2v-1a5 5 0 0 1 10 0v1z"/></svg>
                </div>
                <div class="doctor-summary-info">
                    <h2 class="doctor-name">Dr. Roberto Mendoza</h2>
                    <p class="doctor-spec">Cardiólogo Intensivista</p>
                    <p class="doctor-office">
                        <svg class="icon-inline" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 2.5-2.5 2.5 2.5 0 0 1-2.5 2.5z"/></svg>
                        Clínica El Ávila — Consultorio 304
                    </p>
                </div>
            </div>

            <form class="booking-form" action="perfilUsuario.html" method="GET">
                
                <div class="input-group">
                    <label class="booking-label">SELECCIONA LA FECHA DE TU CITA</label>
                    <input type="date" class="booking-date-input" required>
                </div>

                <div class="input-group">
                    <label class="booking-label">SELECCIONA EL HORARIO DISPONIBLE</label>
                    <div class="time-slots-grid">
                        <button type="button" class="time-slot-btn active" onclick="selectSlot(this)">08:30 AM</button>
                        <button type="button" class="time-slot-btn" onclick="selectSlot(this)">09:15 AM</button>
                        <button type="button" class="time-slot-btn" onclick="selectSlot(this)">10:00 AM</button>
                        <button type="button" class="time-slot-btn" onclick="selectSlot(this)">11:30 AM</button>
                    </div>
                </div>

                <div class="input-group">
                    <label class="booking-label">MOTIVO DE LA CONSULTA (OPCIONAL)</label>
                    <input type="text" placeholder="Ej: Chequeo de rutina, hipertensión, evaluación preoperatoria">
                </div>

                <button type="submit" class="btn-auth btn-submit-booking">CONFIRMAR Y AGENDAR CITA</button>
            </form>

        </section>

    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="index.html">Inicio</a>
                <a href="#">Soporte WhatsApp</a>
            </div>
            <div class="footer-copy">
                <p>&copy; 2026 Vital Space. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <div class="floating-buttons-container">
        <a href="tel:911" class="btn-float btn-float-emergency" title="Llamada de Emergencia">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </a>

        <a href="https://wa.me/584121234567" target="_blank" class="btn-float btn-float-whatsapp" title="Soporte WhatsApp">
            <svg viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.892 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.205 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
        </a>
    </div>

    <script>
        function selectSlot(btn) {
            const buttons = document.querySelectorAll('.time-slot-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
