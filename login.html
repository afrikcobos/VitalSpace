<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Space — Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hero-container">
        
        <a href="index.html" class="logo-wrapper">
            <img src="assets/Recurso 1.svg" alt="Vital Space" class="main-logo">
        </a>

        <section class="auth-card">
            <h2 class="auth-title">INICIAR SESIÓN</h2>

            <form class="auth-form" action="perfilUsuario.html">
                <div class="input-group">
                    <label for="email">CORREO ELECTRÓNICO</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">CONTRASEÑA</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-auth btn-submit">ENTRAR</button>
            </form>

            <div class="auth-switch">
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </section>

    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-links">
                <a href="index.html">Volver al Inicio</a>
                <a href="#">Soporte WhatsApp</a>
            </div>
            <div class="footer-copy">
                <p>&copy; 2026 Vital Space. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.style.opacity = type === 'text' ? '1' : '0.4';
        });
    </script>

</body>
</html>
